# nginx site configuration for the CUBE website + admin.
# Copy to /etc/nginx/sites-available/cubeiitm.org, enable, then:
#   sudo certbot --nginx -d cubeiitm.org -d www.cubeiitm.org
# The app itself listens only on 127.0.0.1:3000 (see ecosystem.config.cjs).

upstream cube_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name cubeiitm.org www.cubeiitm.org;
    # certbot replaces this block with an HTTPS redirect
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cubeiitm.org www.cubeiitm.org;

    # certbot fills these in
    ssl_certificate     /etc/letsencrypt/live/cubeiitm.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cubeiitm.org/privkey.pem;

    # Admin image uploads and applicant CVs are limited to 10 MB by the app.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Common proxy settings. X-Forwarded-Proto lets the app mark the admin
    # login cookie Secure over HTTPS.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Live updates (admin <-> website within ~1 s): a long-lived
    # Server-Sent Events stream that must not be buffered or timed out.
    location = /api/public/live {
        proxy_pass http://cube_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # Built JS/CSS never change for a given build: cache for a year.
    location /_next/static/ {
        proxy_pass http://cube_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://cube_app;
        proxy_read_timeout 120s;
    }
}
